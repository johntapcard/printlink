
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6fc">
  <title>PrintLink</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <div class="logo">🖨️</div>
      <h1>PrintLink</h1>
      <p>Send your print files easily.</p>
    </header>

    <section class="card">
      <h2>Printing Order</h2>
      <p class="description">
        Fill in your details if you want, or contact us directly.
      </p>

      <form id="orderForm">
        <label for="customerName">Your name (optional)</label>
        <input
          id="customerName"
          type="text"
          placeholder="Enter your name"
        >

        <label for="printRequest">What are you printing? (optional)</label>
        <input
          id="printRequest"
          type="text"
          placeholder="Business cards, documents..."
        >

        <label for="quantity">Quantity (optional)</label>
        <input
          id="quantity"
          type="number"
          min="1"
          placeholder="e.g. 100"
        >

        <label for="size">Size / Paper (optional)</label>
        <input
          id="size"
          type="text"
          placeholder="A4, long bond paper..."
        >

        <label for="instructions">Other instructions (optional)</label>
        <textarea
          id="instructions"
          placeholder="Color, deadline, etc."
        ></textarea>

        <button id="sendMessenger" type="button" class="messenger">
          Send via Messenger
        </button>

        <button id="sendEmail" type="button" class="email">
          Prepare Email
        </button>
      </form>
    </section>

    <section class="card contact-card">
      <h2>Our Page</h2>
      <a
        class="facebook"
        href="https://www.facebook.com/profile.php?id=61594294572667"
        target="_blank"
        rel="noopener noreferrer"
      >
        Visit Facebook Page
      </a>


        
<section class="card review-card">
  <h2>Enjoyed our service?</h2>

  <p class="description">
    Your feedback helps us improve and serve you better.
  </p>

  <a
    class="review-button"
    href="https://search.google.com/local/writereview?placeid=ChIJB9LmcYRvvTMRiXdiQpLaThM"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span>⭐ Leave Us a Review</span>
  </a>
</section>




</section>

      

    </section>

    <footer>
      <p>PrintLink · Simple printing orders</p>
    </footer>
  </main>
</body>
</html>
